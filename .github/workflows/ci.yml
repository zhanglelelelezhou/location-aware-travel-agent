name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  AGENT_PROVIDER: mock
  AGENT_PLANNER: rule

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        if: matrix.python-version == '3.11'
        run: python -m ruff check .

      - name: Test with coverage gate
        if: matrix.python-version == '3.11'
        run: >-
          python -m pytest
          --cov=travel_agent
          --cov-report=term-missing
          --cov-fail-under=85

      - name: Compatibility tests
        if: matrix.python-version != '3.11'
        run: python -m pytest

      - name: Offline planner evaluation
        if: matrix.python-version == '3.11'
        run: python evals/run_eval.py

      - name: Offline retrieval evaluation
        if: matrix.python-version == '3.11'
        run: python evals/run_knowledge_eval.py

  container:
    name: Container smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag location-aware-travel-agent:ci .

      - name: Verify non-root runtime
        run: test "$(docker run --rm --entrypoint id location-aware-travel-agent:ci -u)" = "10001"

      - name: Start container
        run: >-
          docker run --detach
          --name travel-agent-ci
          --publish 18000:8000
          --read-only
          --tmpfs /tmp:size=64m
          --security-opt no-new-privileges:true
          location-aware-travel-agent:ci

      - name: Verify health and API
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs travel-agent-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"text":"大阪天气怎么样","location":"大阪"}' \
            http://127.0.0.1:18000/v1/chat

      - name: Stop container
        if: always()
        run: docker rm --force travel-agent-ci || true
